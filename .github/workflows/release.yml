name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-2022

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Install portable executable
        run: cmake --install build --config Release --prefix dist

      - name: Prepare versioned release files
        shell: pwsh
        run: |
          $asset = "PinAppBM-${{ github.ref_name }}-windows-x64.exe"
          Copy-Item "dist/PinAppBM.exe" "dist/$asset"
          $hash = (Get-FileHash "dist/$asset" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $asset" | Set-Content "dist/$asset.sha256" -Encoding ascii

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = "PinAppBM-${{ github.ref_name }}-windows-x64.exe"
          gh release create "${{ github.ref_name }}" "dist/$asset" "dist/$asset.sha256" --generate-notes --title "Pin App BM ${{ github.ref_name }}"
